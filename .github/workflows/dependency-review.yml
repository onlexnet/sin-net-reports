name: "Dependency Review"

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce dependencies with known CVEs of high or
          # critical severity; lower severities are reported but do not fail.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
